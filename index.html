<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Seeti - Code Editor</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Seeti">
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2721/2721626.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/theme/material-darker.min.css">
<style>
:root{--glass:rgba(255,255,255,.08);--glass2:rgba(255,255,255,.14);--border:rgba(255,255,255,.18);--accent:#8b5cf6;--accent2:#06ffa5;--bg:#0f0f14}
*{margin:0;padding:0;box-sizing:border-box}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:var(--glass2);border-radius:10px}::-webkit-scrollbar-thumb:hover{background:var(--accent)}
html,body{height:100vh;width:100vw;overflow:hidden;font-family:'JetBrains Mono',monospace;background:radial-gradient(1200px 600px at 10% -10%,#7c3aed 0%,transparent 60%),radial-gradient(1000px 500px at 90% 10%,#06b6d4 0%,transparent 60%),var(--bg);color:#e8e8ef;display:flex;flex-direction:column;overscroll-behavior:none}
.blur-bg{position:fixed;inset:0;backdrop-filter:blur(80px);pointer-events:none;z-index:0}
#top{height:58px;z-index:10;flex-shrink:0;background:var(--glass);backdrop-filter:blur(20px) saturate(180%);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;padding:0 12px;overflow-x:auto;white-space:nowrap;scroll-behavior:smooth}
#top::-webkit-scrollbar{display:none}
.logo{font-weight:900;font-size:19px;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.glass-btn,.glass-select,.glass-input{background:var(--glass);border:1px solid var(--border);backdrop-filter:blur(12px);color:#fff;padding:8px 12px;border-radius:12px;font-size:13px;cursor:pointer;flex-shrink:0;transition:.2s}
.glass-btn:hover{background:var(--glass2);transform:translateY(-1px)}.glass-btn.active{background:linear-gradient(135deg,var(--accent),#5b21b6)}
#wrap{display:flex;flex:1;overflow:hidden;z-index:5;gap:10px;padding:10px;min-height:0}
.panel{background:var(--glass);backdrop-filter:blur(18px) saturate(160%);border:1px solid var(--border);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;transition:.3s;min-height:0}
#left{width:50%}#right{width:50%}
#left.full{width:100%}#left.full-hide{display:none}#right.full{width:100%}#right.full-hide{display:none}
#tabs{display:flex;background:rgba(0,0,0,.25);border-bottom:1px solid var(--border);overflow-x:auto}
.tab{padding:10px 14px;font-size:12px;border-right:1px solid var(--border);opacity:.7;cursor:pointer;white-space:nowrap}
.tab.active{opacity:1;background:rgba(255,255,255,.08);color:var(--accent2);border-bottom:2px solid var(--accent)}
#editor{flex:1;min-height:0}.CodeMirror{height:100%!important;background:transparent!important;font-size:14px;line-height:1.7}
.CodeMirror-gutters{background:rgba(0,0,0,.2)!important;border-right:1px solid var(--border)!important}
#previewHead{height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:rgba(0,0,0,.2);border-bottom:1px solid var(--border);font-size:12px}
#preview{flex:1;border:none;background:#fff;width:100%}
#history{position:fixed;left:12px;top:70px;bottom:12px;width:340px;max-width:85vw;z-index:20;background:rgba(18,18,28,.85);backdrop-filter:blur(30px) saturate(180%);border:1px solid var(--border);border-radius:20px;transform:translateX(-115%);transition:.35s;padding:16px;overflow:auto}
#history.open{transform:translateX(0)}
.hist-item{padding:12px;border:1px solid var(--border);background:var(--glass);border-radius:12px;margin-bottom:8px;cursor:pointer}
.hist-item:hover{background:var(--glass2);transform:translateX(4px)}
@media(max-width:900px){#wrap{flex-direction:column}#left,#right{width:100%;height:50%}#left.full,#right.full{height:100%}#top{flex-wrap:wrap;height:auto}}
</style>
</head>
<body>
<div class="blur-bg"></div>
<div id="top">
<div class="logo">SEETI</div>
<button class="glass-btn" onclick="toggleHistory()">☰</button>
<button id="installBtn" class="glass-btn" onclick="installPWA()" style="background:linear-gradient(135deg,#8b5cf6,#06ffa5);color:#000;font-weight:900;display:none">📲 Install</button>
<select id="lang" class="glass-select" onchange="changeLang()">
<option value="htmlmixed">Combined - HTML+CSS+JS</option>
<option value="javascript">JavaScript</option>
<option value="css">CSS</option>
<option value="xml">HTML</option>
<option value="jsx">React JSX</option>
<option value="python">Python</option>
<option value="php">PHP</option>
<option value="clike">C/C++/Java</option>
<option value="sql">SQL</option>
<option value="json">JSON</option>
<option value="markdown">Markdown</option>
<option value="ruby">Ruby</option>
<option value="go">Go</option>
<option value="rust">Rust</option>
<option value="yaml">YAML</option>
<option value="shell">Bash</option>
</select>
<select id="project" class="glass-select" onchange="loadProject()"></select>
<button class="glass-btn" onclick="newProject()">+ New</button>
<button id="btnSize" class="glass-btn" onclick="toggleSize()">⛶ Full</button>
<button class="glass-btn active" onclick="runPreview()">▶ Run</button>
<input id="dName" class="glass-input" placeholder="site">
<button class="glass-btn" onclick="createFreeSubdomain()" style="background:linear-gradient(135deg,#06ffa5,#0e639c);color:#000;font-weight:800">Live</button>
</div>

<div id="wrap">
<div id="left" class="panel"><div id="tabs"></div><div id="editor"></div></div>
<div id="right" class="panel"><div id="previewHead"><span>● Live Preview</span><span id="langBadge">COMBINED</span><button class="glass-btn" style="padding:2px 8px;font-size:11px" onclick="toggleSize()">Hide</button></div><iframe id="preview" sandbox="allow-scripts allow-same-origin"></iframe></div>
</div>

<div id="history"><h3>📁 Projects & History</h3><div id="histList" style="margin-top:10px"></div><button class="glass-btn" style="width:100%;margin-top:12px" onclick="toggleHistory()">Close</button></div>

<!-- PWA POPUP -->
<div id="pwaPopup" style="position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(120px);background:rgba(20,20,30,.96);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.2);padding:14px 18px;border-radius:16px;z-index:100;display:flex;gap:12px;align-items:center;transition:.4s;opacity:0;box-shadow:0 10px 40px rgba(0,0,0,.5)">
<span style="font-size:13px">📲 Seeti App install karo?</span>
<button class="glass-btn" onclick="installPWA()" style="background:linear-gradient(135deg,#8b5cf6,#06ffa5);color:#000;font-weight:800">Install</button>
<button class="glass-btn" onclick="hidePWA()">✕</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/htmlmixed/htmlmixed.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/xml/xml.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/javascript/javascript.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/css/css.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/python/python.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/php/php.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/clike/clike.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/jsx/jsx.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/sql/sql.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/markdown/markdown.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/ruby/ruby.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/go/go.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/rust/rust.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/yaml/yaml.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/shell/shell.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/edit/closebrackets.js"></script>

<script>
// PWA REGISTER
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}
let deferredPrompt=null;
const installBtn=document.getElementById('installBtn');
const isStandalone=window.matchMedia('(display-mode: standalone)').matches;
window.addEventListener('beforeinstallprompt',(e)=>{e.preventDefault();deferredPrompt=e;installBtn.style.display='inline-block';setTimeout(()=>showPWA(),2000);});
function showPWA(){if(isStandalone)return;let p=document.getElementById('pwaPopup');p.style.transform='translateX(-50%) translateY(0)';p.style.opacity='1';}
function hidePWA(){let p=document.getElementById('pwaPopup');p.style.transform='translateX(-50%) translateY(120px)';p.style.opacity='0';}
async function installPWA(){if(isStandalone){alert('Already App me khula hai ✅');return;}if(!deferredPrompt){alert('Manual: Chrome ke 3 dot > Save and share > Install / Add to Home Screen');installBtn.textContent='📲 3 dot > Install';return;}deferredPrompt.prompt();const {outcome}=await deferredPrompt.userChoice;if(outcome==='accepted')installBtn.style.display='none';deferredPrompt=null;hidePWA();}
window.addEventListener('appinstalled',()=>{installBtn.style.display='none';hidePWA();});
setTimeout(()=>{if(!isStandalone)installBtn.style.display='inline-block';},1500);

// EDITOR DB
let DB = JSON.parse(localStorage.getItem('seeti_db_final') || `{"projects":{"Welcome":{"parts":{"html":"<h1>Seeti 💎</h1>\\n<p>Combined + PWA Ready</p>","css":"body{background:#111;color:gold;padding:24px;font-family:system-ui}","js":"console.log('Seeti Final')"},"lang":"htmlmixed","time":${Date.now()}}},"current":"Welcome"}`);
function saveDB(){localStorage.setItem('seeti_db_final',JSON.stringify(DB));renderAll();}
let combinedActive='html';
let cm=CodeMirror(document.getElementById('editor'),{value:(DB.projects[DB.current].parts||{html:''}).html,mode:'htmlmixed',theme:'material-darker',lineNumbers:true,lineWrapping:true,autoCloseBrackets:true});
cm.on('change',()=>{let cur=DB.projects[DB.current];if(cur.lang==='htmlmixed'){if(!cur.parts)cur.parts={html:'',css:'',js:''};cur.parts[combinedActive]=cm.getValue();}else{cur.html=cm.getValue();}cur.time=Date.now();saveDB();autoRun();});
let sizeMode='normal';
function toggleSize(){let L=document.getElementById('left'),R=document.getElementById('right'),B=document.getElementById('btnSize');if(sizeMode==='normal'){sizeMode='fullCode';L.className='panel full';R.className='panel full-hide';B.textContent='👁 Preview';}else if(sizeMode==='fullCode'){sizeMode='fullPreview';L.className='panel full-hide';R.className='panel full';B.textContent='📝 Code';}else{sizeMode='normal';L.className='panel';R.className='panel';B.textContent='⛶ Full';}setTimeout(()=>cm.refresh(),200);}
function autoRun(){let p=DB.projects[DB.current];if(p.lang==='htmlmixed'){let parts=p.parts||{html:'',css:'',js:''};document.getElementById('preview').srcdoc=`${parts.html}\n<style>${parts.css}</style>\n<script>${parts.js}<\/script>`;}else{if(['xml','css','javascript','jsx'].includes(p.lang)){document.getElementById('preview').srcdoc=cm.getValue();}else{let c=cm.getValue().replace(/&/g,'&amp;').replace(/</g,'&lt;');document.getElementById('preview').srcdoc=`<pre style="padding:20px;background:#0f0f14;color:#06ffa5;white-space:pre-wrap">${c}</pre>`;}}}
function runPreview(){autoRun();}
function changeLang(){let l=document.getElementById('lang').value;let cur=DB.projects[DB.current];cur.lang=l;if(l==='htmlmixed'){if(!cur.parts)cur.parts={html:cur.html||'',css:'',js:''};document.getElementById('tabs').innerHTML=`<div class="tab active" onclick="switchCombinedTab('html',this)">index.html</div><div class="tab" onclick="switchCombinedTab('css',this)">style.css</div><div class="tab" onclick="switchCombinedTab('js',this)">script.js</div>`;combinedActive='html';cm.setValue(cur.parts.html||'');cm.setOption('mode','htmlmixed');}else{document.getElementById('tabs').innerHTML=`<div class="tab active">${l.toUpperCase()}</div>`;cm.setOption('mode',l==='clike'?'text/x-c++src':l==='shell'?'text/x-sh':l);cm.setValue(cur.html||'');}document.getElementById('langBadge').textContent=l==='htmlmixed'?'COMBINED':l.toUpperCase();saveDB();autoRun();}
function switchCombinedTab(t,el){let cur=DB.projects[DB.current];if(cur.parts)cur.parts[combinedActive]=cm.getValue();combinedActive=t;document.querySelectorAll('#tabs.tab').forEach(x=>x.classList.remove('active'));el.classList.add('active');cm.setValue(cur.parts[t]||'');cm.setOption('mode',t==='css'?'css':t==='js'?'javascript':'htmlmixed');cm.refresh();saveDB();autoRun();}
function newProject(){let n=prompt("Project name?","Seeti "+(Object.keys(DB.projects).length+1));if(!n)return;DB.projects[n]={parts:{html:"",css:"",js:""},html:"",lang:"htmlmixed",time:Date.now()};DB.current=n;combinedActive='html';cm.setValue("");changeLang();saveDB();}
function loadProject(){let n=document.getElementById('project').value;DB.current=n;let cur=DB.projects[n];document.getElementById('lang').value=cur.lang;if(cur.lang==='htmlmixed'){if(!cur.parts)cur.parts={html:cur.html,css:'',js:''};combinedActive='html';cm.setValue(cur.parts.html);}else{cm.setValue(cur.html||'');}changeLang();}
function renderAll(){let s=document.getElementById('project');s.innerHTML=Object.keys(DB.projects).map(k=>`<option ${k===DB.current?'selected':''}>${k}</option>`).join('');let list=document.getElementById('histList');let arr=Object.entries(DB.projects).sort((a,b)=>b[1].time-a[1].time);list.innerHTML=arr.map(([k,v])=>`<div class="hist-item" onclick="openHist('${k.replace(/'/g,"\\'")}')"><b>${k}</b><br><small>${new Date(v.time).toLocaleString()} • ${v.lang}</small></div>`).join('');}
function openHist(k){DB.current=k;toggleHistory();loadProject();}
function toggleHistory(){document.getElementById('history').classList.toggle('open');}
function createFreeSubdomain(){let sub=document.getElementById('dName').value.toLowerCase().replace(/[^a-z0-9-]/g,'');if(!sub)return alert("naam likho");alert("Live: https://"+sub+".seeti.in");}
renderAll();changeLang();autoRun();
document.getElementById('top').addEventListener('wheel',(e)=>{if(Math.abs(e.deltaX)<Math.abs(e.deltaY)){e.currentTarget.scrollLeft+=e.deltaY;e.preventDefault();}},{passive:false});
</script>
</body>
  </html>
