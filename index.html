<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Seeti - Code Editor</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<meta name="theme-color" content="#0f0f14">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/theme/material-darker.min.css">
<style>
:root{--glass:rgba(255,255,255,.08);--glass2:rgba(255,255,255,.14);--border:rgba(255,255,255,.18);--accent:#8b5cf6;--accent2:#06ffa5;--bg:#0f0f14}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100vh;width:100vw;overflow:hidden;font-family:monospace;background:radial-gradient(1200px 600px at 10% -10%,#7c3aed 0%,transparent 60%),radial-gradient(1000px 500px at 90% 10%,#06b6d4 0%,transparent 60%),var(--bg);color:#e8e8ef;display:flex;flex-direction:column}
#top{height:58px;z-index:10;background:var(--glass);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;padding:0 12px;overflow-x:auto}
.logo{font-weight:900;font-size:19px;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;display:flex;align-items:center;gap:6px}
.glass-btn,.glass-select{background:var(--glass);border:1px solid var(--border);color:#fff;padding:8px 12px;border-radius:12px;font-size:13px;cursor:pointer}
.glass-btn.active{background:linear-gradient(135deg,var(--accent),#5b21b6)}
#wrap{display:flex;flex:1;overflow:hidden;gap:10px;padding:10px}
.panel{background:var(--glass);backdrop-filter:blur(18px);border:1px solid var(--border);border-radius:20px;display:flex;flex-direction:column;min-width:0;min-height:0}
#left{width:50%}#right{width:50%}#left.full{width:100%}#left.full-hide{display:none}#right.full{width:100%}#right.full-hide{display:none}
#tabs{display:flex;background:rgba(0,0,0,.25);border-bottom:1px solid var(--border)}
.tab{padding:10px 14px;font-size:12px;opacity:.6;cursor:pointer;border-right:1px solid var(--border)}
.tab.active{opacity:1;background:rgba(139,92,246,.18);color:var(--accent2);border-bottom:2px solid var(--accent2);font-weight:700}
#editor{flex:1}.CodeMirror{height:100%!important;background:transparent!important;font-size:14px}
#previewHead{height:40px;display:flex;justify-content:space-between;align-items:center;padding:0 14px;background:rgba(0,0,0,.2);border-bottom:1px solid var(--border);font-size:12px}
#preview{flex:1;border:none;background:#fff;width:100%}
#history{position:fixed;left:12px;top:70px;bottom:12px;width:320px;z-index:20;background:rgba(18,18,28,.92);border:1px solid var(--border);border-radius:20px;transform:translateX(-115%);transition:.35s;padding:16px;overflow:auto}
#history.open{transform:translateX(0)}
.hist-item{padding:10px;border:1px solid var(--border);background:var(--glass);border-radius:10px;margin-bottom:8px;cursor:pointer}
@media(max-width:900px){#wrap{flex-direction:column}#left,#right{width:100%;height:50%}}
</style>
</head>
<body>
<div id="top">
<div class="logo"><img src="./icon.svg" width="28" height="28" style="border-radius:8px"> SEETI</div>
<button class="glass-btn" onclick="toggleHistory()">☰</button>
<button id="installBtn" class="glass-btn" onclick="installPWA()" style="background:linear-gradient(135deg,#8b5cf6,#06ffa5);color:#000;font-weight:900">📲 Install</button>
<select id="lang" class="glass-select" onchange="changeLang()"><option value="htmlmixed">Combined</option><option value="javascript">JS</option><option value="css">CSS</option><option value="xml">HTML</option></select>
<select id="project" class="glass-select" onchange="loadProject()"></select>
<button class="glass-btn" onclick="newProject()">+ New</button>
<button id="btnSize" class="glass-btn" onclick="toggleSize()">⛶ Full</button>
<button class="glass-btn" onclick="copyCode()" id="copyBtn">⎘ Copy HTML</button>
<button class="glass-btn active" onclick="runPreview()">▶ Run</button>
</div>
<div id="wrap">
<div id="left" class="panel"><div id="tabs"></div><div id="editor"></div></div>
<div id="right" class="panel"><div id="previewHead"><span id="langBadge">HTML - index.html</span><button class="glass-btn" style="padding:2px 8px" onclick="toggleSize()">Hide</button></div><iframe id="preview" sandbox="allow-scripts allow-same-origin"></iframe></div>
</div>
<div id="history"><h3>📁 Projects</h3><div id="histList" style="margin-top:10px"></div><button class="glass-btn" style="width:100%;margin-top:10px" onclick="toggleHistory()">Close</button></div>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/htmlmixed/htmlmixed.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/xml/xml.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/javascript/javascript.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/css/css.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/edit/closebrackets.js"></script>
<script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js',{scope:'./'});}
let deferredPrompt=null;const installBtn=document.getElementById('installBtn');const isStandalone=window.matchMedia('(display-mode: standalone)').matches;
if(isStandalone)installBtn.style.display='none';
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;installBtn.style.display='inline-block';});
async function installPWA(){if(!deferredPrompt){alert('Chrome menu > Install App');return;}deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;installBtn.style.display='none';}
const BOILER={html:`<div class="hero">\n <h1>Seeti 💨</h1>\n <p>Fast • Glass • Code</p>\n <button onclick="whistle()">Press to Whistle</button>\n</div>`,css:`body{height:100vh;display:grid;place-items:center;background:#0f0f14;color:#fff;font-family:system-ui}\n.hero{text-align:center}\nh1{font-size:52px;background:linear-gradient(90deg,#8b5cf6,#06ffa5);-webkit-background-clip:text;-webkit-text-fill-color:transparent}\nbutton{padding:12px 24px;border-radius:999px;border:none;background:linear-gradient(135deg,#8b5cf6,#06ffa5);font-weight:800}`,js:`function whistle(){const a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.frequency.value=800;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(1,a.currentTime);g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.5);o.start();o.stop(a.currentTime+0.5);}`};
let DB=JSON.parse(localStorage.getItem('seeti_v7')||`{"projects":{"Welcome":{"parts":${JSON.stringify(BOILER)},"lang":"htmlmixed","time":${Date.now()}}},"current":"Welcome"}`);
function saveDB(){localStorage.setItem('seeti_v7',JSON.stringify(DB));renderAll();}
let combinedActive='html';
let cm=CodeMirror(document.getElementById('editor'),{value:DB.projects[DB.current].parts.html,mode:'htmlmixed',theme:'material-darker',lineNumbers:true,lineWrapping:true,autoCloseBrackets:true});
cm.on('change',()=>{let cur=DB.projects[DB.current];if(cur.lang==='htmlmixed'){cur.parts[combinedActive]=cm.getValue();}else{cur.html=cm.getValue();}cur.time=Date.now();saveDB();autoRun();});
let sizeMode='normal';function toggleSize(){let L=document.getElementById('left'),R=document.getElementById('right'),B=document.getElementById('btnSize');if(sizeMode==='normal'){sizeMode='fullCode';L.className='panel full';R.className='panel full-hide';B.textContent='👁 Preview';}else if(sizeMode==='fullCode'){sizeMode='fullPreview';L.className='panel full-hide';R.className='panel full';B.textContent='📝 Code';}else{sizeMode='normal';L.className='panel';R.className='panel';B.textContent='⛶ Full';}setTimeout(()=>cm.refresh(),200);}
function autoRun(){let p=DB.projects[DB.current];let pt=p.parts;document.getElementById('preview').srcdoc=`${pt.html}\n<style>${pt.css}</style>\n<script>${pt.js}<\/script>`;}
function runPreview(){autoRun();}
function copyCode(){navigator.clipboard.writeText(cm.getValue()).then(()=>{let b=document.getElementById('copyBtn'),old=b.textContent;b.textContent='✓ Copied!';b.style.background='#06ffa5';b.style.color='#000';setTimeout(()=>{b.textContent=old;b.style.background='';b.style.color='';},1500);});}
function changeLang(){let l=document.getElementById('lang').value;let cur=DB.projects[DB.current];cur.lang=l;document.getElementById('tabs').innerHTML=`<div class="tab active" onclick="switchCombinedTab('html',this)">🌐 index.html</div><div class="tab" onclick="switchCombinedTab('css',this)">🎨 style.css</div><div class="tab" onclick="switchCombinedTab('js',this)">⚡ script.js</div>`;combinedActive='html';cm.setValue(cur.parts.html);cm.setOption('mode','htmlmixed');document.getElementById('langBadge').textContent='HTML - index.html';document.getElementById('copyBtn').textContent='⎘ Copy HTML';cm.refresh();saveDB();autoRun();}
function switchCombinedTab(t,el){let cur=DB.projects[DB.current];cur.parts[combinedActive]=cm.getValue();combinedActive=t;document.querySelectorAll('#tabs.tab').forEach(x=>x.classList.remove('active'));el.classList.add('active');cm.setValue(cur.parts[t]||'');if(t==='css'){cm.setOption('mode','css');document.getElementById('langBadge').textContent='CSS - style.css';}else if(t==='js'){cm.setOption('mode','javascript');document.getElementById('langBadge').textContent='JS - script.js';}else{cm.setOption('mode','htmlmixed');document.getElementById('langBadge').textContent='HTML - index.html';}document.getElementById('copyBtn').textContent='⎘ Copy '+t.toUpperCase();cm.refresh();saveDB();autoRun();}
function newProject(){let n=prompt("Project name?","Seeti "+(Object.keys(DB.projects).length+1));if(!n)return;DB.projects[n]={parts:{html:BOILER.html,css:BOILER.css,js:BOILER.js},lang:"htmlmixed",time:Date.now()};DB.current=n;combinedActive='html';changeLang();saveDB();}
function loadProject(){let n=document.getElementById('project').value;DB.current=n;changeLang();}
function renderAll(){let s=document.getElementById('project');s.innerHTML=Object.keys(DB.projects).map(k=>`<option ${k===DB.current?'selected':''}>${k}</option>`).join('');let arr=Object.entries(DB.projects).sort((a,b)=>b[1].time-a[1].time);document.getElementById('histList').innerHTML=arr.map(([k,v])=>`<div class="hist-item" onclick="openHist('${k}')"><b>${k}</b><br><small>${new Date(v.time).toLocaleString()}</small></div>`).join('');}
function openHist(k){DB.current=k;toggleHistory();loadProject();}
function toggleHistory(){document.getElementById('history').classList.toggle('open');}
renderAll();changeLang();autoRun();
</script>
</body>
</html>
